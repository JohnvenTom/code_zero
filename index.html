<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CODE ZERO —— 浏览器 3D 街机空战游戏" />
    <title>CODE ZERO — 3D 空战</title>
    <style>
      /* 全局文档骨架样式：全屏画布、禁用滚动与边距（HUD 样式由 src/ui 层管理） */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0e13;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- WebGL 画布挂载点（由 render 层填充 canvas） -->
    <div id="app"></div>
    <!-- DOM HUD 覆盖层（由 ui 层填充，UI 不进入 WebGL） -->
    <div id="hud-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
